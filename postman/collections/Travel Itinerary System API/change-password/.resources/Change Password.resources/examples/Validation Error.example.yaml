request:
  url: "{{baseUrl}}/change-password"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "current_password": "string",
        "new_password": "string",
        "confirm_password": "string"
      }
