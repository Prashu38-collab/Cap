$kind: http-request
url: "{{baseUrl}}/change-password"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "current_password": "string",
      "new_password": "string",
      "confirm_password": "string"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Change Password.resources/examples
order: 1000
