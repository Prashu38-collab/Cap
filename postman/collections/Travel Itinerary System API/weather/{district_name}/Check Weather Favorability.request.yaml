$kind: http-request
description: |-
  Evaluates weather rules to see if the content-based filtering output needs 
  to be post-processed for indoor fallback routing.
url: "{{baseUrl}}/weather/:district_name"
method: GET
headers:
  Accept: application/json
pathVariables:
  district_name: string
settings: {}
examples: ./.resources/Check Weather Favorability.resources/examples
order: 1000
