$kind: http-request
name: Change Password
method: PUT
url: '{{baseUrl}}/change-password'
order: 10000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "current_password": "{{testPassword}}",
      "new_password": "NewPass456@",
      "confirm_password": "NewPass456@"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test("Response has success true", () => pm.expect(json.success).to.be.true);
      pm.test("Password changed message present", () => pm.expect(json.message).to.be.a("string"));
      if (pm.response.code === 400) {
          pm.test("Wrong current password returns 400", () => pm.response.to.have.status(400));
          pm.test("Error detail present", () => pm.expect(json.detail).to.be.a("string"));
      }
      if (pm.response.code === 401) {
          pm.test("No token returns 401", () => pm.response.to.have.status(401));
      }
