$kind: http-request
name: Resend OTP
method: POST
url: '{{baseUrl}}/resend-otp'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testEmail}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test("Response has success field", () => pm.expect(json).to.have.property("success"));
      pm.test("Response has message", () => pm.expect(json.message).to.be.a("string"));
      if (pm.response.code === 400) {
          pm.test("Already verified returns 400", () => pm.response.to.have.status(400));
          pm.test("Error detail present", () => pm.expect(json.detail).to.be.a("string"));
      }
      if (pm.response.code === 404) {
          pm.test("User not found returns 404", () => pm.response.to.have.status(404));
      }
