$kind: http-request
name: Reset Password
method: POST
url: '{{baseUrl}}/reset-password'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testEmail}}",
      "new_password": "NewPass456@",
      "confirm_password": "NewPass456@"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test("Response has success true", () => pm.expect(json.success).to.be.true);
      pm.test("Password reset message present", () => pm.expect(json.message).to.be.a("string"));
      if (pm.response.code === 400) {
          pm.test("Mismatched passwords returns 400", () => pm.response.to.have.status(400));
          pm.test("Error detail present", () => pm.expect(json.detail).to.be.a("string"));
      }
