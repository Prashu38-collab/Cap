$kind: http-request
name: Verify Reset OTP
method: POST
url: '{{baseUrl}}/verify-reset-otp'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testEmail}}",
      "otp": "{{testOtp}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test("Response has success true", () => pm.expect(json.success).to.be.true);
      pm.test("OTP verified message present", () => pm.expect(json.message).to.be.a("string"));
      if (pm.response.code === 400) {
          pm.test("Invalid/expired OTP returns 400", () => pm.response.to.have.status(400));
          pm.test("Error detail present", () => pm.expect(json.detail).to.be.a("string"));
      }
