$kind: http-request
name: Forgot Password
method: POST
url: '{{baseUrl}}/forgot-password'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testEmail}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test("Response has success true", () => pm.expect(json.success).to.be.true);
      pm.test("OTP sent message present", () => pm.expect(json.message).to.be.a("string"));
      if (pm.response.code === 404) {
          pm.test("Unknown email returns 404", () => pm.response.to.have.status(404));
          pm.test("Error detail present", () => pm.expect(json.detail).to.be.a("string"));
      }
